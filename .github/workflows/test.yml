name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # e2e 需要真实 ego 浏览器，这里只跑不依赖浏览器的单测。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 钉死在各线的最低修复版本上，不写 24 / 26 这种浮动值：
        # runner 镜像跟不跟得上 Node 发版不由我们决定，实测同一轮里
        # ubuntu 拿到 24.21.0、windows 和 macos 拿到 24.22.x。钉住之后
        # 既保证确定性，又正好在测 engines 声明的下限。
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
