name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # e2e 需要真实 ego 浏览器，这里只跑不依赖浏览器的单测。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
