name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # e2e 需要真实 ego 浏览器，这里只跑不依赖浏览器的单测。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 只测含 2026-10-21 安全修复的版本线；setup-node 取各线最新版
        node: ['22.23.4', 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
